<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Video Downloader - Tanpa Watermark</title>
    <style>
        :root {
            --primary-color: #fe2c55;
            --secondary-color: #25f4ee;
            --bg-color: #0f0f12;
            --card-bg: #1e1e24;
            --text-color: #ffffff;
            --text-muted: #a0a0a0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 100%;
            text-align: center;
            border: 1px solid #2a2a35;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            background: linear-gradient(45deg, var(--secondary-color), var(--primary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #3a3a4a;
            background-color: #121216;
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        button.btn-download {
            padding: 14px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(45deg, var(--primary-color), #d00036);
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        button.btn-download:hover {
            opacity: 0.9;
        }

        button.btn-download:active {
            transform: scale(0.98);
        }

        .loader {
            display: none;
            margin: 20px auto;
            border: 4px solid #2a2a35;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-box {
            display: none;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #2a2a35;
        }

        .result-box img {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .result-box .video-title {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 16px;
            text-align: left;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .download-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .download-links a {
            display: block;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            transition: background 0.3s;
        }

        .btn-no-wm {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-audio {
            background-color: #2a2a35;
            color: var(--text-color);
        }

        .error-message {
            color: #ff4d4d;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>TikTok Downloader</h1>
        <p class="subtitle">Unduh video TikTok tanpa watermark secara gratis</p>

        <div class="input-group">
            <input type="text" id="tiktokUrl" placeholder="Tempel tautan video TikTok di sini..." autocomplete="off">
            <button class="btn-download" onclick="processVideo()">Unduh Video</button>
        </div>

        <div class="error-message" id="errorMsg">Gagal memproses video. Pastikan tautan benar.</div>
        <div class="loader" id="loader"></div>

        <div class="result-box" id="resultBox">
            <img id="videoCover" src="" alt="Video Cover">
            <p class="video-title" id="videoTitle"></p>
            <div class="download-links">
                <a id="linkNoWm" href="#" target="_blank" class="btn-no-wm">Download Video (Tanpa Watermark)</a>
                <a id="linkAudio" href="#" target="_blank" class="btn-audio">Download Audio (MP3)</a>
            </div>
        </div>
    </div>

    <script>
        async function processVideo() {
            const urlInput = document.getElementById('tiktokUrl').value.trim();
            const loader = document.getElementById('loader');
            const resultBox = document.getElementById('resultBox');
            const errorMsg = document.getElementById('errorMsg');

            // Reset tampilan
            errorMsg.style.display = 'none';
            resultBox.style.display = 'none';

            if (!urlInput) {
                showError('Silakan masukkan tautan TikTok terlebih dahulu.');
                return;
            }

            loader.style.display = 'block';

            try {
                // Menggunakan API publik TikWM
                const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(urlInput)}`);
                const result = await response.json();

                loader.style.display = 'none';

                if (result.code === 0) {
                    const data = result.data;
                    
                    document.getElementById('videoCover').src = data.cover;
                    document.getElementById('videoTitle').innerText = data.title || 'Video TikTok';
                    document.getElementById('linkNoWm').href = data.play;
                    document.getElementById('linkAudio').href = data.music;

                    resultBox.style.display = 'block';
                } else {
                    showError('Video tidak ditemukan atau tautan tidak valid.');
                }
            } catch (error) {
                loader.style.display = 'none';
                showError('Terjadi kesalahan koneksi. Coba lagi nanti.');
            }
        }

        function showError(message) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.innerText = message;
            errorMsg.style.display = 'block';
        }
    </script>
</body>
</html>
